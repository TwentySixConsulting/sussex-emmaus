    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <script src="gate.js"></script>
  <script>
  (function () {
    var ENC = "assets/app.enc";
    function boot(bytes) {
      var url = URL.createObjectURL(new Blob([bytes], { type: "text/javascript" }));
      var s = document.createElement("script");
      s.type = "module";
      s.src = url;
      document.body.appendChild(s);
      var g = document.getElementById("se-gate");
      if (g) g.remove();
      document.documentElement.classList.remove("se-unlocking");
      var w = document.getElementById("se-wait");
      if (w) w.remove();
    }
    async function tryOpen(secret, username) {
      var bytes = await window.SEGate.load(ENC, secret);
      window.SEGate.remember(secret, username);
      boot(bytes);
    }
    window.addEventListener("DOMContentLoaded", function () {
      var remembered = window.SEGate.remembered();
      if (remembered) {
        tryOpen(remembered, "Sussex Emmaus").catch(function () {
          // The remembered passphrase no longer works (republished with new
          // credentials, or tampered storage). Show the gate rather than spinning.
          window.SEGate.forget();
          document.documentElement.classList.remove("se-unlocking");
          var w = document.getElementById("se-wait");
          if (w) w.remove();
        });
        return;
      }
      var f = document.getElementById("se-form");
      if (!f) return;
      f.addEventListener("submit", function (e) {
        e.preventDefault();
        var u = document.getElementById("se-u").value.trim();
        var p = document.getElementById("se-p").value;
        var btn = document.getElementById("se-go");
        var err = document.getElementById("se-err");
        err.style.display = "none";
        btn.disabled = true;
        btn.textContent = "Unlocking\u2026";
        // The key is derived from the credentials, so a wrong password simply
        // fails to decrypt. There is no comparison to bypass.
        tryOpen(u.toLowerCase() + ":" + p, "Sussex Emmaus").catch(function () {
          btn.disabled = false;
          btn.textContent = "Open the dashboard";
          err.style.display = "block";
          document.getElementById("se-p").value = "";
        });
      });
    });
  })();
  </script>

    <link rel="stylesheet" crossorigin href="/sussex-emmaus/assets/index-CRuceRj-.css">
  
  <style>
    .se-gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;
      justify-content:center;background:#fff;font-family:Inter,system-ui,sans-serif;padding:24px}
    .se-card{width:100%;max-width:420px;text-align:left}
    .se-brand{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
      color:#7285A5;margin-bottom:18px}
    .se-title{font-size:26px;font-weight:700;color:#121C2B;margin:0 0 6px;letter-spacing:-.02em}
    .se-sub{font-size:13px;color:#5A6472;margin:0 0 22px}
    .se-lbl{display:block;font-size:12px;font-weight:600;color:#121C2B;margin:0 0 5px}
    .se-in{width:100%;box-sizing:border-box;padding:10px 12px;font-size:14px;
      border:1px solid #DEE1E6;border-radius:8px;margin-bottom:14px;font-family:inherit;background:#fff}
    .se-in:focus{outline:none;border-color:#C9785A;box-shadow:0 0 0 3px rgba(201,120,90,.15)}
    .se-btn{width:100%;padding:11px 16px;font-size:14px;font-weight:600;color:#fff;
      background:#C9785A;border:0;border-radius:8px;cursor:pointer;font-family:inherit}
    .se-btn:hover{background:#B0603F}
    .se-btn[disabled]{opacity:.6;cursor:default}
    .se-err{font-size:12.5px;color:#B0603F;margin:12px 0 0;display:none}
    .se-note{font-size:11.5px;color:#8A93A0;margin:18px 0 0;line-height:1.5;
      display:flex;align-items:center;gap:6px;font-weight:600;letter-spacing:.02em}
    .se-note svg{width:13px;height:13px;flex-shrink:0}
    /* Set before first paint when the passphrase is already held, so moving
       between Home, Pay and Benefits does not flash the sign-in screen. Those two
       are separate pages, so each is a full load and the gate would otherwise
       paint for the few hundred ms the decryption takes. */
    .se-unlocking .se-gate{display:none!important}
    .se-unlocking .se-wait{display:flex}
    .se-wait{display:none;position:fixed;inset:0;z-index:99998;align-items:center;
      justify-content:center;background:#fff}
    .se-wait span{width:22px;height:22px;border-radius:50%;border:2.5px solid #E7EAEF;
      border-top-color:#C9785A;animation:se-spin .7s linear infinite}
    @keyframes se-spin{to{transform:rotate(360deg)}}
  </style>
  <script>
    // Runs before the body paints. If this session already unlocked, the gate is
    // hidden from the start and a quiet spinner stands in until the bundle is
    // decrypted and mounted.
    try {
      if (sessionStorage.getItem("sussex-emmaus:unlock")) {
        document.documentElement.classList.add("se-unlocking");
      }
    } catch (e) {}
  </script>
</head>
  <body>

  <div class="se-gate" id="se-gate">
    <form class="se-card" id="se-form" autocomplete="on">
      <div class="se-brand">TwentySix Consulting</div>
      <h1 class="se-title">Sussex Emmaus</h1>
      <p class="se-sub">Pay &amp; Benefits &middot; Q3 2026</p>
      <label class="se-lbl" for="se-u">Username</label>
      <input class="se-in" id="se-u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label class="se-lbl" for="se-p">Password</label>
      <input class="se-in" id="se-p" name="password" type="password" autocomplete="current-password" required>
      <button class="se-btn" id="se-go" type="submit">Open the dashboard</button>
      <p class="se-err" id="se-err">That username or password was not recognised.</p>
      <p class="se-note"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>Encrypted</p>
    </form>
  </div>
  <div class="se-wait" id="se-wait" aria-hidden="true"><span></span></div>

    <div id="root"></div>
  </body>
